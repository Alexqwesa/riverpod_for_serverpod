name: selector_demo_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: ^3.10.1

resolution: workspace

dependencies:
  riverpod_for_serverpod_annotation:
    path: ../../../riverpod_for_serverpod_annotation
  serverpod: 3.4.4

dev_dependencies:
  build_runner: ^2.5.0
  lints: '>=3.0.0 <7.0.0'
  riverpod_for_serverpod_generator:
    path: ../../../riverpod_for_serverpod_generator
  serverpod_test: 3.4.4
  test: ^1.25.5

serverpod:
  scripts:
    ref_endpoints:
      windows: >-
        dart run build_runner build --delete-conflicting-outputs
        & dart run riverpod_for_serverpod_generator:copy_ref_endpoints
      posix: |
        dart run build_runner build --delete-conflicting-outputs &&
        dart run riverpod_for_serverpod_generator:copy_ref_endpoints

    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\selector_demo_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\selector_demo_server\web\app
      posix: |
        cd ../selector_demo_flutter
        flutter build web --base-href /app/ --wasm --output ../selector_demo_server/web/app
