
builders:
  ref_endpoint:
    import: "package:riverpod_for_serverpod_generator/builder.dart"
    builder_factories: [ "refEndpointBuilder" ]
#    build_extensions:
#      # match any lib/**/*.dart
#      '^lib/(.*)\\.dart$': [ "lib/ref_endpoints.dart" ]
    build_extensions:
      "pubspec.yaml": ["lib/src/generated/ref_endpoints.dart"]

    required_inputs:
      - "lib/**.dart"
    #    auto_apply: root_package
    #    auto_apply: dependents
    auto_apply: none
    build_to: source
    runs_before:
      - "source_gen|combining_builder"

